<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Report Abuse - Ripplit</title>
        <link rel="stylesheet" href="/static/style.css" />
        <link rel="stylesheet" href="/static/captcha.css" />
        <link rel="stylesheet" href="/static/report.css" />
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="container">
            <h1 class="logo">Ripplit</h1>
            <div class="card">
                <div id="form-view">
                    <div class="page-header">
                        <div class="page-title">Report Abuse</div>
                    </div>
                    <form id="report-form" class="form-compact">
                        <div class="input-row">
                            <div class="input-label">Links</div>
                            <div class="input-field">
                                <textarea
                                    id="links-input"
                                    class="links-textarea"
                                    placeholder="Paste Ripplit URLs (one per line)&#10;https://example.com/abc123#token"
                                    required
                                ></textarea>
                                <div class="links-preview" id="links-preview"></div>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-label">Type</div>
                            <div class="input-field">
                                <select id="reason" required>
                                    <option value="">Select abuse type</option>
                                    <option value="malware">Malware / Phishing</option>
                                    <option value="spam">Spam</option>
                                    <option value="csam">Child Sexual Abuse Material</option>
                                    <option value="violence">Violence / Gore</option>
                                    <option value="harassment">Harassment / Hate Speech</option>
                                    <option value="copyright">Copyright Violation</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-label">Details</div>
                            <div class="input-field">
                                <textarea
                                    id="description"
                                    placeholder="Describe the issue..."
                                    required
                                ></textarea>
                            </div>
                        </div>
                        <div class="form-footer">
                            <a href="/" class="link-back">← Home</a>
                            <button type="submit" class="btn" id="submit-btn">Submit</button>
                        </div>
                        <div class="error" id="error"></div>
                    </form>
                </div>
                <div class="success" id="success-view">
                    <div class="report-track">
                        <div class="report-track-label">Track Report</div>
                        <div class="report-track-url" id="report-url-display"></div>
                    </div>
                    <div class="report-grid">
                        <div class="report-cell">
                            <div class="report-cell-label">Type</div>
                            <div class="report-cell-value" id="report-reason"></div>
                        </div>
                        <div class="report-cell">
                            <div class="report-cell-label">Links Count</div>
                            <div class="report-cell-value" id="report-count"></div>
                        </div>
                    </div>
                    <div id="links-status-container"></div>
                    <div class="form-footer">
                        <a href="/" class="link-back">← Home</a>
                        <button
                            type="button"
                            class="btn"
                            onclick="window.location.href = '/report'"
                        >
                            New Report
                        </button>
                    </div>
                </div>
            </div>
            <footer class="footer">
                <div class="footer-content">
                    <a
                        href="https://github.com/tn3w/Ripplit"
                        class="footer-link"
                        target="_blank"
                        rel="noopener"
                    >
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                            />
                        </svg>
                        GitHub
                    </a>
                    <span class="footer-separator">·</span>
                    <span class="footer-text">
                        Created by
                        <a
                            href="https://github.com/tn3w"
                            class="footer-link"
                            target="_blank"
                            rel="noopener"
                            >TN3W</a
                        >
                    </span>
                    <span class="footer-separator">·</span>
                    <a
                        href="https://x.com/XorDev/status/1897669357934608590"
                        class="footer-link"
                        target="_blank"
                        rel="noopener"
                        >Credits</a
                    >
                    <span class="footer-separator">·</span>
                    <a href="/terms" class="footer-link">Terms</a>
                    <span class="footer-separator">·</span>
                    <a href="/privacy" class="footer-link">Privacy</a>
                </div>
            </footer>
        </div>
        <script src="/static/shader.js"></script>
        <script src="/static/captcha.js"></script>
        <script src="/static/report.js"></script>
    </body>
</html>
