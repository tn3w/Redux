<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}} - Ripplit</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'SF Mono', Monaco, Inconsolata, monospace;
                color: #e8e8e8;
                overflow: hidden;
                background: #000;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #canvas {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                height: 100%;
                z-index: 0;
                opacity: 0.5;
            }

            .container {
                position: relative;
                z-index: 1;
                text-align: center;
                padding: 2rem;
                max-width: 600px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                justify-content: center;
                gap: 0.75rem;
            }

            .icon {
                font-size: clamp(4rem, 12vw, 6rem);
                margin-bottom: 1rem;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .card {
                background: rgba(20, 20, 20, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                padding: 2.5rem 2rem;
                backdrop-filter: blur(20px);
                animation: fadeIn 0.8s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .title {
                font-size: clamp(1.5rem, 4vw, 2rem);
                font-weight: 300;
                letter-spacing: 0.15em;
                margin-bottom: 1rem;
                text-transform: uppercase;
            }

            .message {
                font-size: 0.95rem;
                color: #888;
                line-height: 1.7;
                margin-bottom: 2rem;
            }

            .actions {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn {
                background: rgba(255, 255, 255, 0.12);
                color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 0.85rem 2rem;
                font-size: 0.8rem;
                font-family: inherit;
                cursor: pointer;
                border-radius: 10px;
                transition: all 0.3s;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                font-weight: 500;
                text-decoration: none;
                display: inline-block;
            }

            .btn:hover {
                background: rgba(255, 255, 255, 0.25);
                border-color: rgba(255, 255, 255, 0.4);
                transform: translateY(-2px);
            }

            .footer {
                position: relative;
                z-index: 0;
                width: 100%;
                max-width: 520px;
            }

            .footer-content {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                flex-wrap: wrap;
                font-size: 0.7rem;
            }

            .footer-link {
                color: rgba(255, 255, 255, 0.4);
                text-decoration: none;
                transition: color 0.2s;
                display: inline-flex;
                align-items: center;
                gap: 0.25rem;
            }

            .footer-link:hover {
                color: rgba(255, 255, 255, 0.8);
            }

            .footer-text {
                color: rgba(255, 255, 255, 0.3);
            }

            .footer-separator {
                color: rgba(255, 255, 255, 0.2);
                user-select: none;
            }

            @media (max-width: 768px) {
                .card {
                    padding: 2rem 1.5rem;
                }
                .actions {
                    flex-direction: column;
                }
                .btn {
                    width: 100%;
                }
                .footer-content {
                    font-size: 0.65rem;
                    gap: 0.4rem;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="container">
            <div class="icon">{{icon}}</div>
            <div class="card">
                <h1 class="title">{{title}}</h1>
                <p class="message">{{message}}</p>
                <div class="actions">
                    <a href="/report/{{report_token}}" class="btn">View Report Status</a>
                </div>
            </div>
            <footer class="footer">
                <div class="footer-content">
                    <a
                        href="https://github.com/tn3w/Ripplit"
                        class="footer-link"
                        target="_blank"
                        rel="noopener"
                    >
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                            />
                        </svg>
                        GitHub
                    </a>
                    <span class="footer-separator">·</span>
                    <span class="footer-text">
                        Created by
                        <a
                            href="https://github.com/tn3w"
                            class="footer-link"
                            target="_blank"
                            rel="noopener"
                            >TN3W</a
                        >
                    </span>
                    <span class="footer-separator">·</span>
                    <a
                        href="https://x.com/XorDev/status/1897669357934608590"
                        class="footer-link"
                        target="_blank"
                        rel="noopener"
                        >Credits</a
                    >
                    <span class="footer-separator">·</span>
                    <a href="/report" class="footer-link">Abuse</a>
                    <span class="footer-separator">·</span>
                    <a href="/terms" class="footer-link">Terms</a>
                    <span class="footer-separator">·</span>
                    <a href="/privacy" class="footer-link">Privacy</a>
                </div>
            </footer>
        </div>
        <script src="/static/shader.js"></script>
    </body>
</html>
