[package]
name = "ripplit"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.2", default-features = false, features = ["rustls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
rand = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.47", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2.6"
base64 = "0.22"
hex = "0.4"

[build-dependencies]
xz2 = "0.1"
ureq = { version = "3.2", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
